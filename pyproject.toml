[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "materials-atlas"
version = "0.1.1"
description = "Python client for the 3D Atlas materials database: search, embeddings, nearest neighbours"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "atom-int" }]
keywords = [
    "materials science",
    "crystal structures",
    "materials project",
    "embeddings",
    "MACE",
    "PET-MAD",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "typing_extensions>=4.4; python_version < '3.12'",
]

[project.optional-dependencies]
pymatgen = ["pymatgen"]
pandas = ["pandas"]
numpy = ["numpy"]
all = ["pymatgen", "pandas", "numpy"]
examples = ["pymatgen", "pandas", "numpy", "plotly", "jupyter"]
dev = ["pytest", "pytest-asyncio", "respx", "pandas", "pymatgen", "numpy", "ruff"]

[project.urls]
Homepage = "https://github.com/atom-int-team/materials-atlas-python-client"
Source = "https://github.com/atom-int-team/materials-atlas-python-client"
Issues = "https://github.com/atom-int-team/materials-atlas-python-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["materials_atlas"]

[tool.hatch.build.targets.sdist]
include = ["materials_atlas", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = ["integration: tests against the production 3D Atlas API (run with -m integration)"]

[tool.ruff]
line-length = 100
target-version = "py310"
# README examples are hand-aligned; the notebook is a demo, not library code.
extend-exclude = ["*.md", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
